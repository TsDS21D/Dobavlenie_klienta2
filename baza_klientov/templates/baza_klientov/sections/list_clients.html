<!--
baza_klientov/templates/baza_klientov/sections/list_clients.html
Секция «Список клиентов» страницы /baza_klientov/.
-->

<section class="list-clients-section" id="list-clients-section">

    <!-- Шапка: название секции + кнопка «Создать». (ТОЛЬКО ОДИН РАЗ) -->
    <div class="list-clients-header">
        <h2 class="list-clients-title">Список клиентов</h2>
        <div class="list-clients-actions">
            <button type="button" class="list-clients-btn-create" id="list-clients-create-btn">
                Создать
            </button>
        </div>
    </div>

    <!-- ==================== ИНЛАЙН-ФОРМА СОЗДАНИЯ КЛИЕНТА ==================== -->
    <div class="list-clients-create-form" id="list-clients-create-form" style="display: none;">
        <form id="list-clients-create-form-el">
            {% csrf_token %}
            
            <div class="list-clients-form-row">
                <div class="list-clients-form-group" style="flex: 3;">
                    <label for="create-client-name">Название / ФИО <span class="required-mark">*</span></label>
                    <input type="text" id="create-client-name" class="baza-form-input" 
                           required placeholder="ООО «Ромашка» или Иванов И.И." maxlength="255">
                </div>
                <div class="list-clients-form-group" style="flex: 1;">
                    <label for="create-client-discount">Скидка (%)</label>
                    <input type="number" id="create-client-discount" class="baza-form-input" 
                           min="0" max="100" value="0">
                </div>
            </div>

            <div class="list-clients-form-row">
                <div class="list-clients-form-group">
                    <label for="create-client-address">Адрес доставки</label>
                    <textarea id="create-client-address" class="baza-form-input" 
                              rows="2" placeholder="Город, улица, дом..."></textarea>
                </div>
            </div>

            <div class="list-clients-form-row">
                <div class="list-clients-form-group">
                    <label for="create-client-comment">Комментарий</label>
                    <textarea id="create-client-comment" class="baza-form-input" 
                              rows="2" placeholder="Дополнительная информация"></textarea>
                </div>
            </div>

            <div class="list-clients-form-actions">
                <button type="button" class="baza-btn-cancel" id="list-clients-create-cancel">Отмена</button>
                <button type="submit" class="baza-btn-submit" id="list-clients-create-submit">Создать клиента</button>
            </div>
        </form>
    </div>

    <!-- Поиск: три поля в одну строку -->
    <div class="list-clients-search-wrap">
        <input type="text" class="list-clients-search" id="list-clients-search-input" placeholder="Общий поиск...">
        <input type="text" class="list-clients-search" id="list-clients-search-le" placeholder="Поиск по юрлицам...">
        <input type="text" class="list-clients-search" id="list-clients-search-contact" placeholder="Поиск по сотрудникам...">
    </div>

    <!-- Таблица клиентов. -->
    <div class="list-clients-table-wrap">
        <table class="list-clients-table">
            <thead>
                <tr>
                    <th class="col-name">Название</th>
                    <th class="col-legal-entities">Юрлица</th>
                    <th class="col-employees">Сотрудники</th>
                    <th class="col-comment">Комментарий</th>
                    <th class="col-number">Номер</th>
                </tr>
            </thead>
            <tbody id="list-clients-table-body">
                {% include "baza_klientov/sections/_client_rows.html" %}
            </tbody>
        </table>

        <div class="list-clients-empty" id="list-clients-empty" {% if clients %}style="display: none;"{% endif %}>
            <p>Клиентов пока нет</p>
            <small>Нажмите «Создать», чтобы добавить первого клиента</small>
        </div>

        <div class="list-clients-empty" id="list-clients-no-results" style="display: none;">
            <p>Ничего не найдено</p>
            <small>Попробуйте изменить поисковый запрос</small>
        </div>
    </div>

</section>

<!-- ==================== МОДАЛКА ДОБАВЛЕНИЯ ЮРЛИЦА ==================== -->
<div class="baza-modal-overlay" id="baza-le-modal-overlay" style="display: none;">
    <div class="baza-modal">
        <div class="baza-modal-header">
            <h3>Добавить юрлицо</h3>
            <button type="button" class="baza-modal-close" id="baza-le-modal-close">×</button>
        </div>
        <div class="baza-modal-body">
            <form id="baza-le-form">
                <input type="hidden" id="baza-le-client-id" value="">
                <div class="baza-form-group">
                    <label for="baza-le-name">Название юрлица <span class="required-mark">*</span></label>
                    <input type="text" id="baza-le-name" class="baza-form-input" required placeholder="ООО «Ромашка»" maxlength="255">
                </div>
                <div class="baza-form-group">
                    <label for="baza-le-requisites">Реквизиты</label>
                    <textarea id="baza-le-requisites" class="baza-form-input" rows="3" placeholder="ИНН, КПП, р/с, БИК, адрес..."></textarea>
                </div>
                <div class="baza-form-group baza-form-checkbox">
                    <label>
                        <input type="checkbox" id="baza-le-has-edo">
                        <span>Подключено ЭДО</span>
                    </label>
                </div>
            </form>
        </div>
        <div class="baza-modal-footer">
            <button type="button" class="baza-btn-cancel" id="baza-le-modal-cancel">Отмена</button>
            <button type="button" class="baza-btn-submit" id="baza-le-modal-submit">Сохранить</button>
        </div>
    </div>
</div>

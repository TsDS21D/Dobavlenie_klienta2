<!--
orders/templates/orders/base.html
Базовый шаблон приложения "Заказы".
Подключает общую панель приложений и определяет блоки для дочерних шаблонов.
-->
<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Кодировка — UTF-8. -->
    <meta charset="UTF-8">
    <!-- Корректное отображение на мобильных. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Заголовок страницы: дочерние шаблоны могут его переопределить. -->
    <title>{% block title %}Заказы{% endblock %} - Система управления</title>
    <!-- CSRF-токен для AJAX-запросов (сохранение комментария и др.). -->
    <meta name="csrf-token" content="{{ csrf_token }}">    
    <!-- Загружаем тег static для работы с CSS/JS. -->
    {% load static %}
    
    <!-- ИКОНКА ДЛЯ ВКЛАДКИ БРАУЗЕРА (Favicon) -->
    <!-- Используем SVG-иконку (коробка), встроенную прямо в код (data URI), -->
    <!-- чтобы не создавать лишних файлов картинок и не зависеть от путей к статике. -->
    <!-- Иконка вкладки с индикатором статуса -->
<link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><line x1='8' y1='6' x2='21' y2='6'></line><line x1='8' y1='12' x2='21' y2='12'></line><line x1='8' y1='18' x2='21' y2='18'></line><line x1='3' y1='6' x2='3.01' y2='6'></line><line x1='3' y1='12' x2='3.01' y2='12'></line><line x1='3' y1='18' x2='3.01' y2='18'></line></svg>">

    <!-- CSS приложения orders. -->
    <link rel="stylesheet" href="{% static 'orders/css/base.css' %}">
    <!-- Дополнительные CSS дочерних шаблонов. -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Общая панель приложений из counter (как в других разделах проекта). -->
    {% include "counter/app_panels.html" with active_app=active_app|default:"orders" %}

    <!-- Основной контейнер страницы. -->
    <div class="container">
        <!-- Блок контента — сюда вставляется содержимое дочерних шаблонов. -->
        {% block content %}{% endblock %}
    </div>

    <!-- Дополнительные JS дочерних шаблонов. -->
    {% block extra_js %}{% endblock %}
</body>
</html>

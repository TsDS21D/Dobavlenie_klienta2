<!--
orders/templates/orders/index.html
Главная страница приложения «Заказы».

Наследуется от orders/base.html.
Содержит:
  - заголовок с логотипом типографии;
  - секцию «Список заказов» (include orders/sections/list_orders.html);
  - контейнер для кратковременных уведомлений;
  - подключение CSS/JS секции (только для этой страницы — не тянем
    на карточку заказа).

ВАЖНО про id="proschety-top-notifications":
    Контейнер уведомлений намеренно назван как в proschety/index.html
    (тот же id). JS-модуль list_orders.js ищет именно этот id — так
    оба приложения используют один контейнер и один набор стилей
    (.proschety-top-notification и его модификаторы) без дублирования.
    Если в будущем понадобится переименовать — правим в двух местах:
    здесь и в list_orders.js (функция showNotification).
-->

{% extends "orders/base.html" %}
{% load static %}

{% block title %}Заказы{% endblock %}

{% block extra_css %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'orders/css/sections/list_orders.css' %}">
{% endblock %}

{% block content %}

    <!-- Заголовок страницы с логотипом типографии. -->
    <h1>
        <img src="https://www.bukva-a.ru/uploads/logo/logo300.png"
             alt="Типография &quot;Буква А&quot;"
             title="Типография &quot;Буква А&quot;"
             width="130">
        Заказы
    </h1>

    <!-- Секция «Список заказов»: таблица, форма создания, поиск,
         модалка удаления. -->
    {% include "orders/sections/list_orders.html" %}

    <!-- Контейнер для плашек «Доставка на сегодня».
         Появляется, только если есть заказы со статусом «в работе»/«готов»
         и датой доставки = сегодня. Плашки нельзя закрыть — они исчезают
         автоматически, когда менеджер меняет delivery_status на «доставлен»
         (событие обновления приходит по WebSocket). -->
    <div id="orders-delivery-today"
         class="orders-delivery-today"></div>


    <!-- Контейнер для кратковременных уведомлений (свои действия).
         Стили и поведение — общие с proschety (см. комментарий выше). -->
    <div id="proschety-top-notifications"
         class="proschety-top-notifications"></div>

    <!-- Контейнер для нижних тостов (события других сессий).
         data-session-key нужен JS, чтобы отличить свои действия от чужих. -->
    <div id="proschety-toasts"
         class="proschety-toasts"
         data-session-key="{{ session_key }}"></div>

{% endblock %}

{% block extra_js %}
{{ block.super }}
<script src="{% static 'orders/js/sections/list_orders.js' %}"></script>
{% endblock %}

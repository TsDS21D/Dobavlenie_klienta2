<!--
proschety/templates/proschety/sections/proschet_components.html
Блок «Печатные компоненты» — стопка отдельных карточек под proschet-section.

СТРУКТУРА:
  - под секцией «Просчёт» идёт КОНТЕЙНЕР (id="proschet-components-list");
  - JS добавляет в него по одной карточке (.proschet-component-card)
    на каждый печатный компонент;
  - если компонентов нет — показывается сообщение.

КАРТОЧКА КОМПОНЕНТА:
  - № (KP-N, моношрифт зелёный)
  - Принтер (позже — смена двойным кликом)
  - Бумага (название + цена мелко серым)
  - Тип (Цветная / Ч/б — позже переключатель)
  - Режим (Одно-/Двусторонний — позже переключатель)
  - Действия (кнопка «×» — позже)
-->

<section class="proschet-components-section"
         id="proschet-components-section"
         style="display: none;">

    <!-- Контейнер, куда JS складывает карточки компонентов -->
    <div class="proschet-components-list"
         id="proschet-components-list">
        <!-- Карточки добавляет JS -->
    </div>

    <!-- Сообщение, если компонентов нет -->
    <div class="proschet-components-empty"
         id="proschet-components-empty"
         style="display: none;">
        <p>Печатных компонентов нет</p>
        <small>Добавьте первый компонент через форму выше</small>
    </div>

</section>

<!-- ==================== МОДАЛКА ПОДТВЕРЖДЕНИЯ УДАЛЕНИЯ КОМПОНЕНТА ==================== -->
<!-- Внешне полностью повторяет модалку удаления просчёта из list_proschet.html. -->
<!-- Отдельная — чтобы не путать контексты и не переиспользовать одну разметку -->
<!-- в двух разных секциях. -->
<div class="list-proschet-confirm-overlay"
     id="proschet-component-confirm-overlay"
     style="display: none;">
    <div class="list-proschet-confirm">
        <div class="list-proschet-confirm-title">Удалить печатный компонент?</div>
        <div class="list-proschet-confirm-text">
            Компонент пропадёт из просчёта.<br>
            Его можно будет восстановить через админку.
        </div>
        <div class="list-proschet-confirm-actions">
            <button type="button"
                    class="list-proschet-confirm-btn list-proschet-confirm-btn-no"
                    id="proschet-component-confirm-no">Отмена</button>
            <button type="button"
                    class="list-proschet-confirm-btn list-proschet-confirm-btn-yes"
                    id="proschet-component-confirm-yes">Удалить</button>
        </div>
    </div>
</div>

<!--
proschety/templates/proschety/sections/proschet_summary.html
Блок «Итоги просчёта» — карточки-показатели под печатными компонентами.

ПОКАЗЫВАЕТ ЧЕТЫРЕ КЛЮЧЕВЫХ ПОКАЗАТЕЛЯ по текущему просчёту:
  - Общая масса заказа (кг);
  - Общий объём заказа (л);
  - Высота готовой стопки (мм, сумма по всем печатным компонентам);
  - Полная стоимость просчёта (₽).

ВСЕ ДАННЫЕ приходят с СУЩЕСТВУЮЩЕГО API приложения calculator:
    GET /calculator/get-proschet-price-data/<proschet_id>/
Ничего в calculator/ не менялось.

СЕКЦИЯ СКРЫТА, пока просчёт не выбран. Показывается из JS
при событии proschetSelected — тем же механизмом, что используют
секции «Просчёт» и «Печатные компоненты».

Логика — в proschety/static/proschety/js/sections/proschet_summary.js.
Стили — в proschety/static/proschety/css/sections/proschet_summary.css.
-->

<section class="proschet-summary-section"
         id="proschet-summary-section"
         style="display: none;">

    <!-- Строка с четырьмя карточками. На узких экранах карточки
         переносятся на следующую строку (flex-wrap). -->
    <!-- Основной контейнер с новой сеткой: слева данные, справа кнопки -->
    <div class="proschet-summary-layout">

        <!-- ЛЕВАЯ КОЛОНКА: Две строки с данными -->
        <div class="proschet-summary-data">
            
            <!-- СТРОКА 1: Физические параметры -->
            <div class="proschet-summary-row">
                <div class="proschet-summary-card">
                    <span class="proschet-summary-label">Общая масса:</span>
                    <span class="proschet-summary-value" id="proschet-summary-mass">—</span>
                </div>

                <div class="proschet-summary-card">
                    <span class="proschet-summary-label">Общий объём:</span>
                    <span class="proschet-summary-value" id="proschet-summary-volume">—</span>
                </div>

                <div class="proschet-summary-card">
                    <span class="proschet-summary-label">Высота стопки:</span>
                    <span class="proschet-summary-value" id="proschet-summary-stack">—</span>
                </div>
            </div>

            <!-- СТРОКА 2: Финансовые параметры -->
            <div class="proschet-summary-row">
                <div class="proschet-summary-card" id="proschet-summary-unit-price-block">
                    <span class="proschet-summary-label">Цена за шт.:</span>
                    <span class="proschet-summary-value" id="proschet-summary-unit-price">—</span>
                </div>

                <div class="proschet-summary-card" id="proschet-summary-price-block">
                    <span class="proschet-summary-label" id="proschet-summary-price-label">К оплате:</span>
                    <span class="proschet-summary-value proschet-summary-value--price" id="proschet-summary-price">—</span>
                </div>

                <!-- Блок скидки (показывается из JS, если скидка есть) -->
                <div class="proschet-summary-card" id="proschet-summary-discount-block" style="display: none;">
                    <span class="proschet-summary-label">Скидка (<span id="proschet-summary-discount-percent">0</span>%):</span>
                    <span class="proschet-summary-value proschet-summary-value--discount" id="proschet-summary-discount-amount">—</span>
                </div>
            </div>

        </div> <!-- /proschet-summary-data -->

        <!-- ПРАВАЯ КОЛОНКА: Кнопки -->
        <div class="proschet-summary-actions">
            <button type="button"
                    class="proschet-summary-btn proschet-summary-btn--secondary"
                    id="create-template-btn"
                    title="Сохранить как шаблон">
                Создать шаблон
            </button>
            <button type="button"
                    class="proschet-summary-btn proschet-summary-btn--primary"
                    id="create-new-order-btn"
                    title="Создать новый заказ из этого просчёта">
                Создать новый заказ
            </button>
            <button type="button"
                    class="proschet-summary-btn proschet-summary-btn--secondary"
                    id="add-to-existing-order-btn"
                    title="Добавить изделие в уже существующий заказ">
                Добавить в имеющийся
            </button>
        </div>

    </div> <!-- /proschet-summary-layout -->

</section>
